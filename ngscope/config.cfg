// NG-Scope configuration. Full reference: docs/configuration.md
//
// Every key NG-Scope actually parses is listed here. A missing key is not fatal, but the
// ones without a built-in default log "ERROR: reading <key>" and are left uninitialised, so
// it is worth keeping the file complete.

/**************************** Top level ****************************/

// Number of RF devices (cells) to decode at once. Max 4.
// Each one needs its own rf_config<N> block, numbered from 0.
nof_rf_dev = 1;

// Target RNTI: the UE followed when decode_single_ue is on, used for PHICH tracking, and
// preferred by the blind decoder when resolving contested candidates.
rnti = 9185;

// Stream decoded DCIs to remote subscribers over the network (the DCI sink server).
remote_enable = true;

// Decode only `rnti` instead of running the multi-UE blind search. Much cheaper.
decode_single_ue = false;

// Decode SIB1/SIB2 and write cell identity and reference signal power to cellcfg.json.
decode_SIB = false;

// Decode Random Access Responses (Msg2) and write one row per RAR to
// <out_dir>/<timestamp>/rar_log-<rf_idx>.csv. Gives you the TTI at which each RNTI was
// assigned. Costs roughly +25% decode time per subframe. Does not change the DCI output.
decode_RAR = true;

// Prime the UE tracker with each RACH-assigned RNTI, so its next genuine PDCCH sighting
// promotes it to "active" instead of needing two. Measured effect on DCI yield: none.
rar_seed_tracker = false;

// Record only DCIs whose RNTI was observed being assigned to a UE that successfully completed
// RACH, plus SI-RNTI/P-RNTI/RA-RNTI which never RACH. Implies decode_RAR, since the RNTI set
// is built from decoded RARs.
//
// Applies to the .dciLog files, cell_status and the remote sink. dci-decode-debug-*.csv is
// always written unfiltered, with a trailing rach_ok column marking what the filter excluded,
// so a single run shows the effect whether or not this is set.
rach_filter_only = false;

// Use the 256QAM MCS->TBS table for C-RNTI Format1/2 grants. Only correct when the cell
// configures altCQI-Table-r12, which a downlink sniffer cannot observe. It sets the tbs
// values written to the .dciLog files, so a wrong guess gives wrong throughput figures.
// SIB, RAR and paging are unaffected either way.
enable_256qam = true;

// Write decoded downlink MAC PDUs to <out_dir>/<timestamp>/mac-<rf_idx>.pcapng (MAC-LTE
// encapsulation, DLT 147). Wireshark needs DLT_USER0 mapped to mac-lte-framed; see
// docs/pcap.md. pcap_max_mb caps each file, 0 for unlimited.
pcap_mac = false;
pcap_max_mb = 0;
// Label each unicast DCI in the .dciLog files as "pre", "post" or "unknown" relative to the
// UE establishing an AS security context with the cell. Implies decode_RAR, which supplies
// the per-RNTI anchor.
//
// The boundary is observed, not inferred. NG-Scope decodes the UE's still-unciphered RRC on
// its C-RNTI and looks for securityModeCommand; nothing is guessed from elapsed time or
// grant counts, and a DCI that cannot be placed stays "unknown". That matters because the
// RAR-to-SecurityModeCommand delay is not a constant: measured on a band 12 capture it ran
// from 45 ms to 1855 ms (median 68 ms), so no fixed window would have worked. Those
// figures are collection times -- the radio domain -- not the host clock, which in a
// replay advances at decode speed and inflated the same measurement by 26 ms at the
// median and by up to a second at the tail.
//
// Two honest limits. AS security actually activates at SecurityModeComplete, which is
// uplink and so invisible to a downlink sniffer, making this boundary a few ms early. And
// coverage depends on the transport block decoding: on a 4-port cell srsRAN cannot
// predecode spatial multiplexing at any antenna count, so two-layer grants never decode --
// measured on a band 12 cell, 8.7% of grants. Those attempts are deliberately NOT filtered
// out; suppressing them was measured to cut SecurityModeCommand detections from 159 to 2,
// because the failing and succeeding attempts are the same population.
// Also writes <out_dir>/<timestamp>/security_log-<rf_idx>.csv: one row per RNTI whose
// boundary was observed (rnti, rar_tti, rar_timestamp, smc_tti, smc_timestamp,
// rar_to_smc_ms). Prefer joining that on rnti and comparing timestamps over reading the
// .dciLog label directly. The label is stamped as each subframe is decoded, so a DCI that
// precedes its boundary cannot be recognised at the time it is written and stays
// "unknown"; measured on a band 12 capture the in-stream label caught about 10% of the
// pre-security DCIs that the join places exactly.
// tools/security_phase_join.py does the join; -f dcilog rewrites the .dciLog files with
// the corrected labels, unchanged in every other respect.
mark_security_phase = false;

// Two decode aids that apply to **replay only** -- task_scheduler.c ANDs each with
// mode == 2, so setting them for a live run does nothing. Both default on; a replay is
// lossless however slow it runs, so the CPU they cost is free there.
//
// rlc_reassembly rejoins an RRC message the eNB split across several grants. It has to hold
// a partial SDU until the rest arrives, which is only sound where no subframe goes missing:
// live capture discards subframes when every decoder is busy, and a discarded middle segment
// would leave a partial that never completes -- indistinguishable from a UE that never
// reached security. On one AT&T capture 8 of 41 DL-DCCH SDUs needed rejoining; on another,
// 2 of 325.
//
// qam_retry stops trusting enable_256qam. When a transport block fails its CRC the grant is
// rebuilt on the other MCS->TBS table and decoded again, keeping whichever passes. The CRC is
// ground truth, so this measures the table rather than guessing it -- and it is per grant,
// which is the only way to be right, since altCQI-Table-r12 is per-UE state. On one capture
// it recovered 37 SecurityModeCommands (33.8% -> 39.2%) at a cost of 1 second in 65.
rlc_reassembly = true;
qam_retry = true;

/************************ Per RF device ****************************/
// Add rf_config1, rf_config2, ... for additional cells and raise nof_rf_dev to match.
// Two devices may not share rf_freq: log files are named by frequency and NG-Scope exits.

rf_config0 = {
    // Downlink centre frequency in Hz. Note the L suffix.
    rf_freq         = 2680000000L;

    // Force the PSS sequence (0-2), or -1 to search all three.
    N_id_2          = -1;

    // Passed straight to the SDR driver, e.g. "type=b200,clock_source=external". Max 100 chars.
    rf_args         = "type=x300";

    // DCI decoder threads for this cell. Max 8. Too few and subframes are dropped in live
    // capture, or replay falls behind real time.
    nof_thread      = 3;

    // Receive channels on this SDR. Two are required for TM3/TM4 with two spatial layers.
    // Needs a B210, or an X310 with two daughterboards; useless on a 4-port cell.
    nof_rx_ant      = 1;

    // Disable the GUI for this cell. Only meaningful in builds with ENABLE_GUI.
    disable_plot    = true;

    // These three control which .dciLog files are written, per cell.
    log_dl          = true;
    log_ul          = true;
    log_phich       = false;

    // 0 = normal, 1 = record IQ to disk, 2 = replay IQ from disk.
    mode            = 0;

    // Source file for mode 2. Ignored otherwise: recording always writes to
    // <out_dir>/<timestamp>/recorded-samples.bin.
    replay_fname    = "/tmp/ngscope_iq.bin";

    // Verbose per-subframe tracing. Thousands of lines per second.
    debug           = false;

    // Suppress the per-subframe summary lines.
    silent          = false;

    // Decode the control channel. false synchronises and records without decoding, which is
    // what you want for a pure IQ capture.
    decode_pdcch    = true;
}

/************************** DCI logging ****************************/

dci_log_config = {
    // Seconds between log file rotations; each rotation opens a new timestamped file.
    // -1 or 0 disables rotation.
    // Which .dciLog files get written is set per device by rf_config<N>.log_dl/log_ul/log_phich.
    log_interval = 5;
}
