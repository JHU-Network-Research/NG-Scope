#
# Starter NG-Scope configuration for the snap.
#
# This file is copied to $SNAP_USER_COMMON/config.cfg on first run
# (~/snap/ngscope/common/config.cfg). Edit that copy, not this one --
# this one is inside the read-only squashfs and is re-copied only if
# the destination is missing.
#
# Syntax is libconfig. Every key below is read by ngscope_read_config()
# in ngscope/src/dciLib/load_config.c; most have no default, so keep
# them all present even when they are not relevant to your setup.
#

# Number of rf_configN blocks below that are actually used.
nof_rf_dev = 1;

# RNTI to follow when decode_single_ue is true.
rnti = 9185;

# Bind the DCI sink server on port 6767 so remote_client can attach.
remote_enable = true;

# Track a single UE (rnti above) rather than every UE on the cell.
decode_single_ue = false;

# Decode SIB1 and write it to the -s output directory.
decode_SIB = false;

rf_config0 = {
    # Downlink centre frequency of the cell, in Hz.
    rf_freq         = 1845000000L;

    # PSS sequence to lock onto; -1 searches all three.
    N_id_2          = -1;

    # UHD device args. Examples:
    #   B200/B210 over USB   -> "type=b200"      or "serial=31XXXXX"
    #   X300/X310 over 10GbE -> "type=x300,addr=192.168.40.2"
    #   X410 over 10/100GbE  -> "type=x4xx,addr=192.168.40.2"
    # Run `ngscope.uhd-find` to list what is attached.
    rf_args         = "type=b200";

    nof_thread      = 3;

    # false shows the srsGUI plot window for this device.
    disable_plot    = false;

    log_dl          = true;
    log_ul          = true;
    log_phich       = false;

    # 0 = NORMAL (live), 1 = RECORD IQ to rr_fname, 2 = REPLAY from rr_fname.
    mode            = 0;

    # IQ record/replay file, used only when mode is 1 or 2.
    # Must be somewhere the snap can write: keep it under $HOME or
    # $SNAP_USER_COMMON. /tmp is NOT writable under strict confinement.
    rr_fname        = "ngscope_iq.bin";

    debug           = false;
    silent          = false;

    decode_pdcch    = true;
}

dci_log_config = {
    log_dl       = true;
    log_ul       = true;
    log_interval = 5;   # seconds
}
