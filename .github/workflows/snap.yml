name: Build snap

on:
  push:
    branches: [master, snap]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

# softprops/action-gh-release creates a release and uploads an asset, which
# needs write access. The default GITHUB_TOKEN is read-only on repositories
# created since 2023 (and wherever an org sets it that way), so without this
# the build succeeds and the release step fails with 403.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7
        with:
          # snapcraft.yaml derives the version from `git describe`, which needs
          # the full history and tags rather than the default shallow clone.
          fetch-depth: 0

      - name: Build the snap
        id: build
        uses: snapcore/action-build@v1

      - name: Smoke-test the built snap
        run: |
          # The kde-neon extension supplies Qt5 through this content snap.
          # snapd does not pull default-providers in for a --dangerous local
          # install, so ngscope would otherwise start without its Qt5 libraries.
          sudo snap install kf5-core22
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
          # -h exercises the launcher, the dynamic linker and the Qt5 content
          # snap without needing a radio attached.
          # This alone proves every NEEDED library resolved: the binary could
          # not reach its help text otherwise. It also proves the RF plugin
          # dlopen'ed, since ngscope prints "Active RF plugins:" before parsing
          # arguments (lib/src/phy/rf/rf_imp.c:112-118).
          snap run ngscope -h | tee /tmp/help.txt
          grep -q "Active RF plugins: libsrsran_rf_uhd.so" /tmp/help.txt \
            || { echo "::error::UHD RF plugin did not load"; exit 1; }

          # Belt and braces on top of the above. ldd must run with the same
          # library path the launcher sets, so source the snap's own helper
          # rather than reimplementing it -- a bare `ldd` here runs OUTSIDE the
          # sandbox with no LD_LIBRARY_PATH and reports every bundled library
          # as "not found", which is a property of the shell, not the snap.
          export SNAP=/snap/ngscope/current
          . "$SNAP/bin/uhd-env.sh"
          uhd_setup_libs
          ldd "$SNAP/usr/bin/ngscope" | tee /tmp/ldd.txt
          if grep -q "not found" /tmp/ldd.txt; then
            echo "::error::unresolved shared libraries in the built snap"
            exit 1
          fi
          # A host path such as /usr/local/lib/libsrsgui.so would mean the
          # build leaked off the runner instead of using the srsgui part.
          if grep -q "/usr/local/" /tmp/ldd.txt; then
            echo "::error::snap links a host /usr/local library"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ngscope-snap
          path: ${{ steps.build.outputs.snap }}

      - name: Attach the snap to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.build.outputs.snap }}
          body: |
            Install:

            ```
            sudo snap install --dangerous ngscope_*.snap
            sudo snap connect ngscope:raw-usb            # USB radios (B200/B210) only
            ```

            See `SNAP.md` for the host udev rule that USB radios also
            need, and for UHD FPGA version requirements on X310/X410.
